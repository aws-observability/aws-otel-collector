# Sends traces to the X-Ray OTLP endpoint and metrics to the CloudWatch OTLP endpoint.
# Requires the AWS_REGION environment variable. Enable CloudWatch Transaction Search
# before sending traces to the OTLP endpoint. The IAM role needs CloudWatchAgentServerPolicy.
# https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-OTLPEndpoint.html
extensions:
  health_check:
  sigv4auth/traces:
    region: ${env:AWS_REGION}
    service: xray
  sigv4auth/metrics:
    region: ${env:AWS_REGION}
    service: monitoring

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch/traces:
    timeout: 1s
    send_batch_size: 50
  batch/metrics:
    timeout: 60s
  # Resource attributes match the CloudWatch Container Insights OpenTelemetry pipeline
  # (amazon-cloudwatch-observability Helm chart).
  resource_detection:
    detectors:
      - env
      - ec2
    ec2:
      resource_attributes:
        host.id: { enabled: true }
        host.type: { enabled: true }
        host.name: { enabled: true }
        host.image.id: { enabled: true }
        cloud.provider: { enabled: true }
        cloud.platform: { enabled: true }
        cloud.region: { enabled: true }
        cloud.availability_zone: { enabled: true }
        cloud.account.id: { enabled: true }
  # cloud.resource_id is the ARN of the EC2 instance, unless the application set one.
  transform/cloud_resource_id:
    error_mode: ignore
    trace_statements:
      - &cloud_resource_id
        context: resource
        statements:
          - set(resource.attributes["cloud.resource_id"], Concat(["arn:aws-cn:ec2:", resource.attributes["cloud.region"], ":", resource.attributes["cloud.account.id"], ":instance/", resource.attributes["host.id"]], ""))
            where resource.attributes["cloud.resource_id"] == nil and resource.attributes["cloud.platform"] == "aws_ec2" and IsMatch(resource.attributes["cloud.region"], "^cn-") and resource.attributes["cloud.account.id"] != nil and resource.attributes["host.id"] != nil
          - set(resource.attributes["cloud.resource_id"], Concat(["arn:aws-us-gov:ec2:", resource.attributes["cloud.region"], ":", resource.attributes["cloud.account.id"], ":instance/", resource.attributes["host.id"]], ""))
            where resource.attributes["cloud.resource_id"] == nil and resource.attributes["cloud.platform"] == "aws_ec2" and IsMatch(resource.attributes["cloud.region"], "^us-gov-") and resource.attributes["cloud.account.id"] != nil and resource.attributes["host.id"] != nil
          - set(resource.attributes["cloud.resource_id"], Concat(["arn:aws:ec2:", resource.attributes["cloud.region"], ":", resource.attributes["cloud.account.id"], ":instance/", resource.attributes["host.id"]], ""))
            where resource.attributes["cloud.resource_id"] == nil and resource.attributes["cloud.platform"] == "aws_ec2" and resource.attributes["cloud.region"] != nil and resource.attributes["cloud.account.id"] != nil and resource.attributes["host.id"] != nil
    metric_statements:
      - *cloud_resource_id

exporters:
  otlp_http/traces:
    compression: gzip
    traces_endpoint: https://xray.${env:AWS_REGION}.amazonaws.com/v1/traces
    auth:
      authenticator: sigv4auth/traces
  otlp_http/metrics:
    compression: gzip
    metrics_endpoint: https://monitoring.${env:AWS_REGION}.amazonaws.com/v1/metrics
    auth:
      authenticator: sigv4auth/metrics

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource_detection, transform/cloud_resource_id, batch/traces]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp]
      processors: [resource_detection, transform/cloud_resource_id, batch/metrics]
      exporters: [otlp_http/metrics]

  extensions: [health_check, sigv4auth/traces, sigv4auth/metrics]
