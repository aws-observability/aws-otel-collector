AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Runs the ADOT Collector as an ECS sidecar that sends traces and metrics to the
  CloudWatch OTLP endpoints (traces to X-Ray, metrics to CloudWatch). Enable
  CloudWatch Transaction Search before sending traces to the OTLP endpoint.
Parameters:
  ClusterName:
    Type: String
    Description: Enter the name of your ECS cluster from which you want to collect metrics
  CreateIAMRoles:
    Type: String
    Default: 'False'
    AllowedValues:
      - 'True'
      - 'False'
    Description: Whether to create default IAM roles
    ConstraintDescription: must specify True or False.
  TaskRoleArn:
    Type: String
    Default: Default
    Description: Enter the role arn you want to use as the ecs task role
  ExecutionRoleArn:
    Type: String
    Default: Default
    Description: Enter the role arn you want to use as the ecs execution role
  command:
    Type: String
    Description: >-
      Leave empty to use the CloudWatch OTLP endpoint configuration defined in this
      template. To use a configuration bundled in the collector image instead, enter
      for example --config=/etc/ecs/ecs-default-config.yaml
    Default: ''
Conditions:
  UseInlineConfig: !Equals
    - !Ref command
    - ''
  CreateRoles: !Equals
    - !Ref CreateIAMRoles
    - 'True'
  DefaultTaskRole: !Equals
    - !Ref TaskRoleArn
    - Default
  DefaultExecutionRole: !Equals
    - !Ref ExecutionRoleArn
    - Default
Resources:
  ECSTaskDefinition:
    Type: 'AWS::ECS::TaskDefinition'
    Properties:
      Family: ecs-aws-otel-sidecar-service
      TaskRoleArn: !If
        - CreateRoles
        - !GetAtt
          - ECSTaskRole
          - Arn
        - !If
          - DefaultTaskRole
          - !Sub 'arn:aws:iam::${AWS::AccountId}:role/AWSOTelRole'
          - !Ref TaskRoleArn
      ExecutionRoleArn: !If
        - CreateRoles
        - !GetAtt
          - ECSExecutionRole
          - Arn
        - !If
          - DefaultExecutionRole
          - !Sub 'arn:aws:iam::${AWS::AccountId}:role/AWSOTelExecutionRole'
          - !Ref ExecutionRoleArn
      NetworkMode: bridge
      ContainerDefinitions:
        - Name: aws-collector
          Image: 'public.ecr.aws/aws-observability/aws-otel-collector:latest'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: 'True'
              awslogs-group: /ecs/aws-collector
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          Command: !If
            - UseInlineConfig
            - !Ref 'AWS::NoValue'
            - [!Ref command]
          Environment: !If
            - UseInlineConfig
            - - Name: AOT_CONFIG_CONTENT
                Value: !Sub |
                  extensions:
                    health_check:
                    sigv4auth/traces:
                      region: ${AWS::Region}
                      service: xray
                    sigv4auth/metrics:
                      region: ${AWS::Region}
                      service: monitoring
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                          endpoint: 0.0.0.0:4317
                        http:
                          endpoint: 0.0.0.0:4318
                    statsd:
                      endpoint: 0.0.0.0:8125
                      aggregation_interval: 60s
                  processors:
                    batch/traces:
                      timeout: 1s
                      send_batch_size: 50
                    batch/metrics:
                      timeout: 60s
                  exporters:
                    otlp_http/traces:
                      compression: gzip
                      traces_endpoint: https://xray.${AWS::Region}.${AWS::URLSuffix}/v1/traces
                      auth:
                        authenticator: sigv4auth/traces
                    otlp_http/metrics:
                      compression: gzip
                      metrics_endpoint: https://monitoring.${AWS::Region}.${AWS::URLSuffix}/v1/metrics
                      auth:
                        authenticator: sigv4auth/metrics
                  service:
                    extensions: [health_check, sigv4auth/traces, sigv4auth/metrics]
                    pipelines:
                      traces:
                        receivers: [otlp]
                        processors: [batch/traces]
                        exporters: [otlp_http/traces]
                      metrics:
                        receivers: [otlp, statsd]
                        processors: [batch/metrics]
                        exporters: [otlp_http/metrics]
            - !Ref 'AWS::NoValue'
          HealthCheck:
            Command:
              - "/healthcheck"
            Interval: 5
            Retries: 2
            Timeout: 3
        - Name: ot-sample-app
          Image: 'public.ecr.aws/aws-otel-test/aws-otel-java-spark:latest'
          Essential: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: 'True'
              awslogs-group: /ecs/ot-sample-app
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          Environment:
            - Name: OTEL_EXPORTER_OTLP_ENDPOINT
              Value: 'http://aws-collector:4318'
            - Name: OTEL_METRICS_EXPORTER
              Value: otlp
            - Name: OTEL_LOGS_EXPORTER
              Value: none
            - Name: OTEL_RESOURCE_ATTRIBUTES
              Value: 'service.namespace=AWSOTel,service.name=ecs-otel-sample-app'
            - Name: AWS_REGION
              Value: !Ref 'AWS::Region'
            - Name: LISTEN_ADDRESS
              Value: '0.0.0.0:4567'
          DependsOn:
            - ContainerName: aws-collector
              Condition: START
          Links:
            - aws-collector
        - Name: nginx
          Image: 'public.ecr.aws/nginx/nginx:latest'
          Essential: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: 'True'
              awslogs-group: /ecs/nginx
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          DependsOn:
            - ContainerName: aws-collector
              Condition: START
        - Name: aoc-statsd-emitter
          Image: 'public.ecr.aws/amazonlinux/amazonlinux:latest'
          Essential: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: 'True'
              awslogs-group: /ecs/statsd-emitter
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          DependsOn:
            - ContainerName: aws-collector
              Condition: START
          EntryPoint:
            - "/bin/sh"
            - "-c"
            - "yum install -y socat; while true; do echo 'statsdTestMetric:1|c' | socat -v -t 0 - UDP:aws-collector:8125; sleep 1; done"
          Links:
            - aws-collector
        - Name: traffic-generator
          Image: 'public.ecr.aws/amazonlinux/amazonlinux:latest'
          Essential: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-create-group: 'True'
              awslogs-group: /ecs/traffic-generator
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
          DependsOn:
            - ContainerName: ot-sample-app
              Condition: START
          EntryPoint:
            - "/bin/sh"
            - "-c"
            - "sleep 30; while :; do curl -s http://ot-sample-app:4567/outgoing-http-call > /dev/null 2>&1; sleep 10s; curl -s http://ot-sample-app:4567/aws-sdk-call > /dev/null 2>&1; sleep 10s; done"
          Links:
            - ot-sample-app
      RequiresCompatibilities:
        - EC2
      Cpu: '1024'
      Memory: '2048'
  ECSReplicaService:
    Type: 'AWS::ECS::Service'
    Properties:
      TaskDefinition: !Ref ECSTaskDefinition
      Cluster: !Ref ClusterName
      LaunchType: EC2
      SchedulingStrategy: REPLICA
      DesiredCount: 1
      ServiceName: aws-otel-sidecar-service
  ECSTaskRole:
    Type: 'AWS::IAM::Role'
    Condition: CreateRoles
    Properties:
      Description: Allows ECS tasks to call AWS services on your behalf.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ''
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: AWSOpenTelemetryPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:PutLogEvents'
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:DescribeLogStreams'
                  - 'logs:DescribeLogGroups'
                  - 'cloudwatch:PutMetricData'
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                  - 'xray:GetSamplingRules'
                  - 'xray:GetSamplingTargets'
                  - 'xray:GetSamplingStatisticSummaries'
                  - 'ssm:GetParameters'
                  - 's3:Get*'
                  - 's3:List*'
                Resource: '*'
      RoleName: AWSOTelRole
  ECSExecutionRole:
    Type: 'AWS::IAM::Role'
    Condition: CreateRoles
    Properties:
      Description: >-
        Allows ECS container agent makes calls to the Amazon ECS API on your
        behalf.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ''
            Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
        - 'arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess'
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
      RoleName: AWSOTelExecutionRole
